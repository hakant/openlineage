# Minimal Marquez server config (values come from the compose environment).
server:
  applicationConnectors:
    - type: http
      port: 5000
      httpCompliance: RFC7230_LEGACY
  adminConnectors:
    - type: http
      port: 5001

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-marquez}
  user: ${POSTGRES_USER:-marquez}
  password: ${POSTGRES_PASSWORD:-marquez}

# Apply schema migrations automatically when the API starts.
migrateOnStartup: true

graphql:
  enabled: true

logging:
  level: INFO
  appenders:
    - type: console
