name: shop
version: "1.0.0"
config-version: 2
profile: shop

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

seeds:
  shop:
    +column_types:
      order_id: bigint
      customer_id: bigint
      amount_cents: bigint

models:
  shop:
    staging:
      +materialized: view
    marts:
      +materialized: table
